name = "schedule-availability"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# The jonyen.com/schedule/busy.json route is managed outside this file: the
# deploy token intentionally has no Workers Routes permission. Create the route
# once in the Cloudflare dashboard (Workers & Pages > schedule-availability >
# Settings > Domains & Routes), after which every deploy just replaces the
# script behind it.
#
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_PERSONAL,
# GOOGLE_REFRESH_ACTS2 and OUTLOOK_ICS_URL are set by the deploy workflow with
# `wrangler secret put`. The refresh tokens carry only the calendar.freebusy
# scope; mint new ones with availability/scripts/mint-google-token.mjs.

[vars]
# Calendars each Google account reads, comma-separated. The acts2 list adds the
# shared "A2K + Churchwide (mirror)" calendar.
GOOGLE_CALENDARS_PERSONAL = "jonyen@gmail.com"
GOOGLE_CALENDARS_ACTS2 = "jonathan.yen@acts2.network,c_af3b7f631adc7ad1b21f146dd993ff7644bd739a3c920ded3bcc79099b90b72c@group.calendar.google.com"
# Calendars whose all-day (20h+) blocks are not busy, e.g. the Monday
# "E-Sabbath & Family Night" on the A2K + Churchwide mirror.
GOOGLE_SKIP_ALL_DAY = "c_af3b7f631adc7ad1b21f146dd993ff7644bd739a3c920ded3bcc79099b90b72c@group.calendar.google.com"
