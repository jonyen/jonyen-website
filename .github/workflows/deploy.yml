name: Deploy site and Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:worker

      # `npm run build` triggers prebuild, which renders the public (phone-free)
      # resume PDFs into public/resume before Vite copies them into the bundle.
      - run: npm run build

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fail if a phone number reached the published PDFs
        run: node resume/check-public.mjs

      # The site is served by the jonyen-site Worker from static assets (see
      # site/wrangler.toml), not by GitHub Pages.
      - name: Deploy site Worker
        working-directory: site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-resume-links:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The full PDFs carry the phone number, so they are rendered here and
      # bundled straight into the Worker. They are never committed.
      - name: Render full resume PDFs
        run: npm run resume:full
        env:
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}

      - name: Bundle PDFs into the Worker
        run: node resume/bundle-worker.mjs

      - name: Publish signing secret
        working-directory: worker
        run: echo "$LINK_SECRET" | npx wrangler secret put LINK_SECRET
        env:
          LINK_SECRET: ${{ secrets.RESUME_LINK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-availability:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Google refresh tokens carry only the calendar.freebusy scope, and
      # the Outlook feed is a published "Can view when I'm busy" ICS URL.
      - name: Publish secrets
        working-directory: availability
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_PERSONAL GOOGLE_REFRESH_ACTS2 OUTLOOK_ICS_URL; do
            printenv "$name" | npx wrangler secret put "$name"
          done
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.SCHEDULE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.SCHEDULE_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_PERSONAL: ${{ secrets.SCHEDULE_GOOGLE_REFRESH_PERSONAL }}
          GOOGLE_REFRESH_ACTS2: ${{ secrets.SCHEDULE_GOOGLE_REFRESH_ACTS2 }}
          OUTLOOK_ICS_URL: ${{ secrets.SCHEDULE_OUTLOOK_ICS_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: availability
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-quip:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Bindings are declared in quip/wrangler.toml. The Worker's secrets
      # (ANTHROPIC_API_KEY, GOATCOUNTER_TOKEN) are set with `wrangler secret
      # put` and survive deploys.
      - name: Deploy Worker
        working-directory: quip
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
