<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
    <title>Jonathan Yen Resume (Frontend)</title>
    <meta http-equiv="refresh" content="0; url=/resume/jonathan-yen-resume-frontend.pdf">
    <link rel="canonical" href="/resume/jonathan-yen-resume-frontend.pdf">
    <script>
        // Anonymous, cookieless visit count via GoatCounter (same site as the
        // homepage). count.js would never load before this page redirects, so
        // ping its endpoint directly; sendBeacon survives the navigation.
        // b=153 flags automated browsers as count.js does, so GoatCounter drops them.
        try {
            navigator.sendBeacon('https://jonyen-website.goatcounter.com/count?' + new URLSearchParams({
                p: '/resume/frontend', t: document.title, r: document.referrer, s: String(screen.width), rnd: String(Math.random()).slice(2),
                ...(navigator.webdriver ? { b: '153' } : {}),
            }));
        } catch (e) {}
        window.location.replace('/resume/jonathan-yen-resume-frontend.pdf');
    </script>
</head>
<body>
    <p>Redirecting to <a href="/resume/jonathan-yen-resume-frontend.pdf">Jonathan Yen Resume (Frontend)</a>...</p>
</body>
</html>
