<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Jonathan Yen</title>
    <link rel="icon" type="image/svg+xml" id="favicon" href="/favicon.svg">
    <meta name="description" content="When Jonathan Yen is free on weekdays over the next two weeks, and a calendar to book a time.">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #16181d;
            --muted: #5b616b;
            --line: #e3e5e8;
            --free: #e8f4ec;
            --busy: #9aa1ab;
            --past: #f1f2f4;
            --busy-fg: #ffffff;
            --free-fg: #1f7a3f;
            --accent: #0b5fff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121417;
                --fg: #eceef1;
                --muted: #9aa1ab;
                --line: #2a2e34;
                --free: #1b3324;
                --busy: #5b616b;
                --past: #1c1f23;
                --busy-fg: #eceef1;
                --free-fg: #7fd19b;
                --accent: #6b9cff;
            }
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main { max-width: 78rem; margin: 0 auto; padding: 2rem 16px 3rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
        .lede { margin: 0 0 1.25rem; color: var(--muted); }
        .note { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
        .warn { color: #b25e00; }

        .weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
        .weeknav h2 { font-size: 1.05rem; margin: 0; }
        .weeknav button {
            font: inherit; font-size: 1.1rem; line-height: 1; width: 2.25rem; height: 2.25rem;
            border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer;
        }
        .weeknav button:disabled { opacity: .35; cursor: default; }

        .week { --hour: 36px; display: grid; grid-template-columns: 3.25rem repeat(5, 1fr); }
        .week .head { text-align: center; font-size: .85rem; padding-bottom: .35rem; border-bottom: 1px solid var(--line); }
        .week .head b { display: block; font-size: 1rem; }
        .week .head.today b { color: var(--accent); }
        .hours, .col { position: relative; height: calc(var(--hour) * 13); }
        .hours span { position: absolute; right: .4rem; margin-top: 1px; font-size: .7rem; line-height: 1.2; color: var(--muted); white-space: nowrap; }
        .col {
            background: var(--free); border-left: 1px solid var(--bg);
            background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hour) - 1px), var(--line) calc(var(--hour) - 1px), var(--line) var(--hour));
        }
        .col i {
            position: absolute; left: 2px; right: 2px; border-radius: 3px; background: var(--busy);
            font-style: normal; font-size: .7rem; line-height: 1.2; padding: 2px 4px; overflow: hidden; color: var(--busy-fg);
        }
        .col i.free { background: transparent; color: var(--free-fg); font-weight: 600; }
        .col i.past { left: 0; right: 0; border-radius: 0; background: var(--past); opacity: .9; }

        .layout { display: grid; gap: 2.5rem; align-items: start; }
        .booking { border-top: 1px solid var(--line); padding-top: 1.5rem; }
        @media (min-width: 64rem) {
            .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .layout .booking { border-top: 0; padding-top: 0; }
            .layout .booking iframe { height: 640px; }
        }
        .copybox { margin-top: 1.25rem; }
        .copybox header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
        .copybox h3 { font-size: .95rem; margin: 0; }
        .copybox button {
            font: inherit; font-size: .85rem; padding: .3rem .75rem; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--line); background: var(--bg); color: var(--fg);
        }
        .copybox pre {
            margin: 0; padding: .75rem; border: 1px solid var(--line); border-radius: 8px;
            font: .9rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; white-space: pre-wrap; user-select: all;
        }
        .booking h2 { font-size: 1.25rem; margin: 0 0 1rem; }
        .booking iframe { display: block; width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
        .booking .note { margin-top: .5rem; }
        .booking a { color: var(--accent); }
        @media (max-width: 30rem) {
            .week { --hour: 30px; grid-template-columns: 2.75rem repeat(5, 1fr); }
            .week .head { font-size: .75rem; }
        }
    </style>
</head>
<body>
<main>
    <h1>When I'm free</h1>
    <p class="lede">Weekdays, 8am to 9pm Eastern time, over the next two weeks. Pick a time in the booking calendar.</p>
    <p class="note" id="status">Loading…</p>
    <div class="layout">
    <div id="calendar" hidden>
        <div class="weeknav">
            <button type="button" id="prev" aria-label="Previous week">‹</button>
            <h2 id="weeklabel"></h2>
            <button type="button" id="next" aria-label="Next week">›</button>
        </div>
        <div class="week" id="week"></div>
        <div class="copybox">
            <header><h3>Free times as text</h3><button type="button" id="copy">Copy</button></header>
            <pre id="freetext"></pre>
        </div>
    </div>
    <section id="book" class="booking">
        <h2>Book a time</h2>
        <iframe src="https://calendar.google.com/calendar/appointments/AcZssZ0ErAD3_ySrke5VN5jq51fzheAJUb2TH8HMOQQ=?gv=true" title="Book a time with Jonathan Yen" loading="lazy"></iframe>
        <p class="note"><a href="https://calendar.google.com/calendar/appointments/AcZssZ0ErAD3_ySrke5VN5jq51fzheAJUb2TH8HMOQQ=">Open the booking page in a new tab</a> if it doesn't show here.</p>
    </section>
    </div>
</main>
<script>
(() => {
    const HOME_TZ = 'America/New_York';
    const START_HOUR = 8;
    const END_HOUR = 21;
    const DAY = 86400000;

    const $ = (id) => document.getElementById(id);

    // Favicon: a calendar page showing today's date in Eastern time.
    const todayNum = new Intl.DateTimeFormat('en-US', { timeZone: HOME_TZ, day: 'numeric' }).format(Date.now());
    $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">` +
        `<rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="#fff" stroke="#0b5fff" stroke-width="3"/>` +
        `<path d="M1.5 7.5a6 6 0 0 1 6-6h17a6 6 0 0 1 6 6v2.5h-29z" fill="#0b5fff"/>` +
        `<text x="16" y="26.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" ` +
        `font-weight="700" font-size="${todayNum.length > 1 ? 16 : 18}" fill="#0b5fff">${todayNum}</text></svg>`);
    const statusEl = $('status');

    // Offset in ms of `tz` at instant `ms` (positive east of UTC).
    function offset(tz, ms) {
        const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
            timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
        }).formatToParts(ms).map(x => [x.type, x.value]));
        return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000;
    }
    // UTC instant of wall-clock y-m-d h:00 in `tz`.
    function zoned(tz, y, m, d, h) {
        const guess = Date.UTC(y, m, d, h);
        const first = guess - offset(tz, guess);
        return guess - offset(tz, first);
    }
    // Eastern calendar date of an instant, as a UTC-midnight "day number" in ms.
    function homeDay(ms) {
        const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: HOME_TZ, year: 'numeric', month: 'numeric', day: 'numeric' })
            .formatToParts(ms).map(x => [x.type, x.value]));
        return Date.UTC(+p.year, p.month - 1, +p.day);
    }
    const mondayOf = (day) => day - ((new Date(day).getUTCDay() + 6) % 7) * DAY;

    let data = null;
    let weekIndex = 0;
    let weeks = [];

    function render() {
        const tz = HOME_TZ;
        const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' });
        const fmtHour = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric' });
        const fmtDow = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short' });
        const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
        const busy = data.busy.map(b => [Date.parse(b.start), Date.parse(b.end)]);
        const now = Date.now();
        const today = homeDay(now);
        const monday = weeks[weekIndex];

        $('weeklabel').textContent = `Week of ${fmtDate.format(monday)}`;
        $('prev').disabled = weekIndex === 0;
        $('next').disabled = weekIndex === weeks.length - 1;

        const grid = $('week');
        grid.replaceChildren(document.createElement('div'));
        for (let i = 0; i < 5; i++) {
            const day = monday + i * DAY;
            const head = document.createElement('div');
            head.className = day === today ? 'head today' : 'head';
            head.innerHTML = `${fmtDow.format(day)}<b>${new Date(day).getUTCDate()}</b>`;
            grid.append(head);
        }

        const d0 = new Date(monday);
        const hours = document.createElement('div');
        hours.className = 'hours';
        for (let h = START_HOUR; h < END_HOUR; h++) {
            const label = document.createElement('span');
            label.style.top = `${((h - START_HOUR) / (END_HOUR - START_HOUR)) * 100}%`;
            const at = zoned(HOME_TZ, d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate(), h);
            label.textContent = fmtHour.format(at).replace(' ', '').toLowerCase();
            hours.append(label);
        }
        grid.append(hours);

        // Compact times for the text list: "9–10:30am", "11am–2pm".
        const short = (ms) => {
            const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true })
                .formatToParts(ms).map(x => [x.type, x.value]));
            return { t: p.minute === '00' ? p.hour : `${p.hour}:${p.minute}`, ap: p.dayPeriod.toLowerCase() };
        };
        const shortRange = (s, e) => {
            const a = short(s), b = short(e);
            return a.ap === b.ap ? `${a.t}–${b.t}${b.ap}` : `${a.t}${a.ap}–${b.t}${b.ap}`;
        };
        const textLines = [];

        const dataEnd = Date.parse(data.to);
        for (let i = 0; i < 5; i++) {
            const day = new Date(monday + i * DAY);
            const y = day.getUTCFullYear(), m = day.getUTCMonth(), d = day.getUTCDate();
            const winStart = zoned(HOME_TZ, y, m, d, START_HOUR);
            const winEnd = zoned(HOME_TZ, y, m, d, END_HOUR);
            const span = winEnd - winStart;
            const col = document.createElement('div');
            col.className = 'col';

            const place = (s, e, cls, title, label) => {
                s = Math.max(s, winStart); e = Math.min(e, winEnd);
                if (e <= s) return;
                const el = document.createElement('i');
                if (cls) el.className = cls;
                el.style.top = `${((s - winStart) / span) * 100}%`;
                el.style.height = `${((e - s) / span) * 100}%`;
                if (title) el.title = title;
                // Label only blocks tall enough to hold the text.
                if (label && e - s >= 30 * 60000) el.textContent = label;
                col.append(el);
            };
            const range = (s, e) => `${fmtTime.format(Math.max(s, winStart))}–${fmtTime.format(Math.min(e, winEnd))}`;
            // Past time and time beyond the feed both read as unavailable.
            const blocked = [[winStart, now], [dataEnd, winEnd]];
            const free = [];
            place(winStart, now, 'past');
            place(dataEnd, winEnd, 'past');
            for (const [s, e] of busy) {
                if (e > winStart && s < winEnd) {
                    place(s, e, '', `Busy ${range(s, e)}`, 'Busy');
                    blocked.push([s, e]);
                }
            }
            // Free time is whatever the blocked intervals leave open.
            const clipped = blocked
                .map(([s, e]) => [Math.max(s, winStart), Math.min(e, winEnd)])
                .filter(([s, e]) => e > s)
                .sort((a, b) => a[0] - b[0]);
            let cursor = winStart;
            for (const [s, e] of clipped) {
                if (s > cursor) free.push([cursor, s]);
                cursor = Math.max(cursor, e);
            }
            if (cursor < winEnd) free.push([cursor, winEnd]);
            for (const [s, e] of free) place(s, e, 'free', `Free ${range(s, e)}`, 'Free');
            const open = free.filter(([s, e]) => e - s >= 30 * 60000);
            if (winEnd > now && winStart < dataEnd) {
                textLines.push(`${fmtDow.format(day)}, ${fmtDate.format(day)}: ${open.length ? open.map(([s, e]) => shortRange(s, e)).join(', ') : 'no open time'}`);
            }
            grid.append(col);
        }

        $('freetext').textContent = textLines.length
            ? `Free times (Eastern):\n${textLines.join('\n')}`
            : 'No open weekday time left this week.';
        $('copy').textContent = 'Copy';

        const updated = fmtTime.format(Date.parse(data.generatedAt));
        statusEl.className = data.incomplete ? 'note warn' : 'note';
        statusEl.textContent = data.incomplete
            ? `One of my calendars didn't load, so some busy times may be missing. Updated ${updated}.`
            : `Updated ${updated}.`;
    }

    $('copy').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText($('freetext').textContent);
            $('copy').textContent = 'Copied';
        } catch {
            getSelection().selectAllChildren($('freetext'));
            $('copy').textContent = 'Press ⌘C';
        }
    });
    $('prev').addEventListener('click', () => { if (weekIndex > 0) { weekIndex--; render(); } });
    $('next').addEventListener('click', () => { if (weekIndex < weeks.length - 1) { weekIndex++; render(); } });

    fetch('/schedule/busy.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(json => {
            data = json;
            const now = Date.now();
            const today = homeDay(now);
            let monday = mondayOf(today);
            // On a weekend, start with the coming week.
            if (new Date(today).getUTCDay() % 6 === 0) monday += 7 * DAY;
            const last = homeDay(Date.parse(json.to));
            for (; monday <= last; monday += 7 * DAY) weeks.push(monday);
            $('calendar').hidden = false;
            render();
        })
        .catch(() => {
            statusEl.className = 'note warn';
            statusEl.textContent = "Availability couldn't load right now. Use the booking calendar to see open slots.";
        });
})();
</script>
</body>
</html>
